# Prepare a private .env from relay.env.example. Do not share an IP or store with a running relay.
services:
  relay:
    image: ${RELAY_IMAGE:?Set an immutable repository@sha256 digest}
    container_name: shout-calendar-relay
    restart: unless-stopped
    init: true
    read_only: true
    user: "1654:1654"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2.0
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ${RELAY_DATA:?Set the relay data directory}:/data
      - ${RELAY_ADMIN_TOKEN_FILE:?Set a readable token file outside this repository}:/run/secrets/relay-admin:ro
    command: ["serve", "--store", "/data", "--http", "8787", "--trusted-proxy", "${RELAY_TRUSTED_PROXY:?Set the reverse proxy IP}", "--admin-token-file", "/run/secrets/relay-admin", "--retention-days", "14", "--max-connections", "128", "--max-items", "64", "--requests-per-client", "120", "--requests-per-second", "2000"]
    healthcheck:
      test: ["CMD", "dotnet", "ShoutCalendar.Sync.Relay.dll", "health"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      relay_lan:
        ipv4_address: ${RELAY_IP:?Set an unused relay IP}
networks:
  relay_lan:
    external: true
    name: ${RELAY_NETWORK:?Set the external network name}
